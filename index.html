<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Консультации: дашборд</title>
<style>
:root{color-scheme:light;--bg:#f6f5f2;--card:#fcfcfb;--border:#e3e1db;--text:#0b0b0b;--muted:#6b6963;--accent:#2a78d6;--bad:#d03b3b}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#121211;--card:#1a1a19;--border:#33332f;--text:#f0efec;--muted:#a3a198;--accent:#3987e5;--bad:#e66767}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
form{width:min(100%,360px);background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;display:grid;gap:12px}
h1{font-size:18px;margin:0;font-weight:650}
p{margin:0;color:var(--muted);font-size:13px}
input[type=password]{font:inherit;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.r{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
button{font:inherit;font-weight:600;padding:10px 12px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Консультации по новостройкам</h1>
  <p>Дашборд закрыт паролем. Введите пароль, который вам выдали.</p>
  <input type="text" name="username" value="dashboard" autocomplete="username" hidden>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Пароль" required autofocus aria-label="Пароль">
  <label class="r"><input id="rem" type="checkbox"> Запомнить на этом устройстве</label>
  <button id="go" type="submit">Открыть</button>
  <div class="err" id="err" role="alert"></div>
  <p>Обновлено: 08.11.2026 16:13</p>
</form>

  if (new TextDecoder().decode(raw.slice(0, 8)) !== 'Salted__') throw new Error('format');
  const salt = raw.slice(8, 16), data = raw.slice(16);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base, 384));
  const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: bits.slice(32, 48) }, key, data);
  return new TextDecoder().decode(plain);
}
async function open(pw, remember) {
  const html = await unlock(pw);
  try { remember ? localStorage.setItem('dash-pw', pw) : localStorage.removeItem('dash-pw'); } catch (e) {}
  document.open(); document.write(html); document.close();
}
const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');

  try { await open(document.getElementById('pw').value, document.getElementById('rem').checked); }
