<title>Простор: аналитика консультаций</title>
<style>
:root{color-scheme:light;--navy:#012E45;--blue:#1879D4;--orange:#FA7C03;--bg:#F8F9FC;--card:#FFFFFF;--border:#DFE6EF;--text:#012E45;--muted:#6B7F8C;--bad:#E5484D}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 "Lato","Trebuchet MS","Segoe UI",Arial,sans-serif;padding:16px}
form{width:min(100%,380px);background:var(--card);border:1px solid var(--border);border-top:4px solid var(--orange);border-radius:14px;padding:28px 24px 22px;display:grid;gap:12px;box-shadow:0 4px 24px rgba(1,46,69,.08)}
.logo{display:block;height:44px;width:auto;margin:0 0 6px}
h1{font-family:"Trebuchet MS","Lato",Arial,sans-serif;font-size:19px;margin:0;font-weight:700;color:var(--navy)}
p{margin:0;color:var(--muted);font-size:13px}
input[type=password]{font:inherit;padding:11px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);width:100%}
input[type=password]:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(24,121,212,.15)}
button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
label.r{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
label.r input{accent-color:var(--blue)}
button{font:inherit;font-weight:700;padding:11px 12px;border:0;border-radius:10px;background:var(--blue);color:#fff;cursor:pointer}
button:hover{background:#1468b8}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function unlock(pw) {
